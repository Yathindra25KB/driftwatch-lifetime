name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.3"
      - name: Install locked environment
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format check
        run: uv run --frozen ruff format --check .
      - name: Fast tests
        run: uv run --frozen pytest -q
      - name: Slow tests (synthetic grids, tables and figures)
        run: uv run --frozen pytest -q -m slow
      - name: Guardrail demonstration
        run: uv run --frozen python scripts/check_guardrails.py
      - name: Reproduce Table 1 (smoke, synthetic fixture)
        run: uv run --frozen driftwatch reproduce table1 --smoke --out reports/reproduction

  windows-smoke:
    name: windows-smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.3"
      - name: Install locked environment
        run: uv sync --frozen
      - name: Fast tests
        run: uv run --frozen pytest -q
      - name: Guardrail demonstration
        run: uv run --frozen python scripts/check_guardrails.py
      - name: Reproduce Table 1 (smoke, synthetic fixture)
        run: uv run --frozen driftwatch reproduce table1 --smoke --out reports/reproduction
