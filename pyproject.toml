[project]
name = "driftwatch-lifetime"
version = "0.1.0"
description = "Time-aware study of malware-detector lifetime under label delay, a fixed analyst budget and conformal drift monitoring."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yathindra K B" }]
keywords = [
    "malware detection",
    "concept drift",
    "label delay",
    "active learning",
    "conformal prediction",
    "time-aware evaluation",
    "reproducibility",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "gdown>=6.4.2",
    "huggingface-hub>=2.2.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    # PyPI rejects any upload carrying a "Private ::" classifier. Removed only in the
    # release commit, after the licence, ethics and claims audits and the researcher's
    # explicit go (ADR-0003, docs/RELEASING.md).
    "Private :: Do Not Upload",
]

[project.urls]
Homepage = "https://github.com/Yathindra25KB/driftwatch-lifetime"
Documentation = "https://yathindra25kb.github.io/driftwatch-lifetime/latest/"
Source = "https://github.com/Yathindra25KB/driftwatch-lifetime"
Issues = "https://github.com/Yathindra25KB/driftwatch-lifetime/issues"
Changelog = "https://github.com/Yathindra25KB/driftwatch-lifetime/blob/main/CHANGELOG.md"

[project.scripts]
driftwatch = "driftwatch.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Never build the environment on a system, conda or Anaconda interpreter.
python-preference = "only-managed"
# Keep uv's package cache next to the project (the development drive), not on the system
# drive. A relative path is resolved from the directory uv is run in, i.e. the repo root.
cache-dir = ".cache/uv"
# The docs group is installed by default so the licence audit and its test see every locked
# package (ADR-0011); neither group is a runtime dependency of the wheel.
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
# Distribution name is driftwatch-lifetime (ADR-0003); the import name stays driftwatch.
module-name = "driftwatch"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["driftwatch"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Test temp files live under the repo (on the development drive); pytest recreates it per run.
addopts = ["--strict-markers", "-m", "not slow", "--basetemp=.pytest-tmp"]
markers = ["slow: long-running tests; excluded by default, run with `uv run pytest -m slow`"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
# documentation site (ADR-0011); not a runtime dependency, so the wheel does not grow
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.1,<9.2",  # 9.2 needs Python 3.13; this project is pinned to 3.12
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=2.1.1",
]
